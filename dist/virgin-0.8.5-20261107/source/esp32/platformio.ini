[platformio]
default_envs = mini_no_psram
src_dir = main

[env]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
build_flags = -DVIRGIN_EMBEDDED=1 -fstack-usage

[env:mini_no_psram]
board_build.sdkconfig = sdkconfig.mini_no_psram
build_flags = ${env.build_flags} -DVIRGIN_EMBEDDED_HASH_KIB=32 -DVIRGIN_EMBEDDED_MAX_PLY=24

[env:mini_psram_qspi]
board_build.sdkconfig = sdkconfig.mini_psram_qspi
build_flags = ${env.build_flags} -DVIRGIN_EMBEDDED_HASH_KIB=1024 -DVIRGIN_EMBEDDED_MAX_PLY=64 -DVIRGIN_USE_PSRAM=1

[env:mini_psram_opi]
board_build.sdkconfig = sdkconfig.mini_psram_opi
build_flags = ${env.build_flags} -DVIRGIN_EMBEDDED_HASH_KIB=1024 -DVIRGIN_EMBEDDED_MAX_PLY=64 -DVIRGIN_USE_PSRAM=1
