<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virgin 0.8.5 – WebAssembly</title>
<style>body{font:16px system-ui;background:#101a29;color:#edf5ff;max-width:1000px;margin:36px auto;padding:0 20px}h1{font-size:28px}button,input{font:inherit;padding:10px;border-radius:6px;border:1px solid #52718c;margin:4px}button{background:#204c70;color:white;cursor:pointer}input{background:#15273b;color:white;min-width:55%}pre{background:#08111e;padding:16px;white-space:pre-wrap;height:50vh;overflow:auto}#status{color:#76d5bb}</style>
<h1>Virgin 0.8.5 · WebAssembly</h1><p>Dirk D. Sommerfeld · UCI-Integration</p>
<p id="status">Engine wird geladen …</p>
<div><button id="new">Neue Partie</button><button id="adaptive">Adaptive</button><button id="full">Volle Stärke</button><button id="search">2 Sekunden rechnen</button><button id="analyse">Analyse</button><button id="stop">Stop</button></div>
<form id="commands"><input id="command" aria-label="UCI-Befehl" value="position startpos moves e2e4 e7e5"><button>Senden</button></form>
<pre id="log" aria-live="off"></pre>
<script>
const worker = new Worker('./engine-worker.js');
const log = document.querySelector('#log');
function write(text){log.textContent += text+'\n';if(log.textContent.length>100000)log.textContent=log.textContent.slice(-80000);log.scrollTop=log.scrollHeight;}
function send(text){write('> '+text);worker.postMessage(text);}
worker.onmessage=({data})=>{
 if(typeof data==='string')write(data);
 else if(data.type==='ready'){document.querySelector('#status').textContent='Virgin bereit';send('uci');send('isready');}
 else if(data.type==='error'){document.querySelector('#status').textContent=data.message;write('ERROR '+data.message);}
};
worker.onerror=event=>{document.querySelector('#status').textContent=event.message;};
document.querySelector('#commands').onsubmit=event=>{event.preventDefault();send(document.querySelector('#command').value);};
document.querySelector('#new').onclick=()=>{send('stop');send('ucinewgame');send('position startpos');send('isready');};
document.querySelector('#adaptive').onclick=()=>{send('stop');send('setoption name Adaptive value true');send('isready');};
document.querySelector('#full').onclick=()=>{send('stop');send('setoption name Adaptive value false');send('setoption name UCI_LimitStrength value false');send('isready');};
document.querySelector('#search').onclick=()=>send('go movetime 2000');
document.querySelector('#analyse').onclick=()=>send('go infinite');
document.querySelector('#stop').onclick=()=>send('stop');
window.addEventListener('pagehide',()=>worker.terminate());
</script></html>
